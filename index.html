<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>W Perfume | Atelier de Fragancias</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: {
              400: '#D4AF37',
              500: '#C5A028',
              600: '#AA820A',
            },
            dark: {
              900: '#0B0B0C',
              800: '#141416',
              700: '#1F1F23',
              600: '#2A2A30'
            }
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['Courier Prime', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons & Fonts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0B0C;
      color: #E4E4E7;
    }
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-mono { font-family: 'Courier Prime', monospace; }
    
    /* Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0B0C;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A2A30;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #D4AF37;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-black">

  <!-- TOP NOTICE BAR -->
  <div class="bg-gold-500 text-black text-xs font-semibold uppercase tracking-widest text-center py-2 px-4">
    ✨ Catálogo Oficial Atelier de Fragancias • Envíos a Nivel Nacional
  </div>

  <!-- NAVIGATION -->
  <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-dark-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      
      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('catalog')">
        <div class="w-10 h-10 rounded-full border border-gold-400/40 flex items-center justify-center bg-dark-800 text-gold-400 font-serif font-bold text-xl shadow-lg shadow-gold-500/5">
          W
        </div>
        <div>
          <h1 class="font-serif font-bold text-xl tracking-wider text-white">W PERFUME</h1>
          <p class="text-[10px] tracking-widest uppercase text-gold-400 font-mono">Atelier de Fragancias</p>
        </div>
      </div>

      <!-- Actions Right -->
      <div class="flex items-center gap-3">
        <!-- Search Input -->
        <div class="relative hidden md:block w-64">
          <input type="text" id="global-search" oninput="renderCatalog()" placeholder="Buscar esencia..." class="w-full bg-dark-800 border border-dark-600 rounded-full py-1.5 pl-9 pr-4 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-gold-400 transition" />
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-zinc-500"></i>
        </div>

        <!-- Mode Toggle Button (Admin / Client) -->
        <button id="view-toggle-btn" onclick="toggleView()" class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider px-3.5 py-2 rounded-lg border border-dark-600 bg-dark-800 text-zinc-300 hover:text-white hover:border-gold-400 transition">
          <i data-lucide="sliders" class="w-4 h-4 text-gold-400"></i>
          <span id="view-toggle-text">Panel Admin</span>
        </button>

        <!-- Cart Button -->
        <button onclick="toggleCartDrawer()" class="relative bg-gold-500 hover:bg-gold-400 text-black p-2.5 rounded-lg transition font-medium flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-count" class="bg-black text-gold-400 text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- ==================== CATALOG VIEW ==================== -->
    <section id="catalog-view" class="space-y-8">
      
      <!-- HERO BANNER -->
      <div class="relative rounded-2xl overflow-hidden bg-gradient-to-r from-dark-800 via-dark-700 to-dark-800 border border-dark-700 p-8 md:p-12 shadow-2xl">
        <div class="max-w-2xl space-y-4">
          <span class="inline-block px-3 py-1 bg-gold-500/10 border border-gold-500/30 text-gold-400 text-xs uppercase tracking-widest rounded-full font-mono">Formulación & Alta Perfumería</span>
          <h2 class="font-serif text-3xl sm:text-5xl font-bold tracking-tight text-white leading-tight">
            Descubre Esencias Exclusivas & Sets Especial
